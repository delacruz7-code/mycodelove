<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(-45deg, #ff758c, #ff7eb3, #a18cd1, #fbc2eb);
        background-size: 400% 400%;
        animation: fundo 10s ease infinite;
    }

    @keyframes fundo {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(12px);
        padding: 50px;
        border-radius: 30px;
        border: 1px solid rgba(255,255,255,0.4);
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        z-index: 10;
    }

    .coracao {
        font-size: 90px;
        animation: pulsar 1.2s infinite;
        margin-bottom: 20px;
    }

    @keyframes pulsar {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.2);
        }
    }

    h1 {
        color: white;
        font-size: 32px;
        margin-bottom: 30px;
        text-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    button {
        border: none;
        padding: 18px 35px;
        border-radius: 50px;
        background: white;
        color: #ff4f81;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.08);
        box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    button:active {
        transform: scale(0.95);
    }

    .flutuante {
        position: absolute;
        bottom: -50px;
        font-size: 25px;
        animation: subir linear infinite;
        opacity: 0.7;
    }

    @keyframes subir {
        from {
            transform: translateY(0) rotate(0deg);
            opacity: 0;
        }
        20% {
            opacity: 0.8;
        }
        100% {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }
</style>
```

</head>

<body>

```
<div class="container">
    <div class="coracao">❤️</div>

    <h1>Você me ama?</h1>

    <button onclick="window.location.href='amor.html'">
        Clique se você me ama ❤️
    </button>
</div>

<div class="flutuante" style="left:10%; animation-duration:7s;">❤️</div>
<div class="flutuante" style="left:25%; animation-duration:10s;">💕</div>
<div class="flutuante" style="left:40%; animation-duration:8s;">💗</div>
<div class="flutuante" style="left:60%; animation-duration:12s;">❤️</div>
<div class="flutuante" style="left:75%; animation-duration:9s;">💖</div>
<div class="flutuante" style="left:90%; animation-duration:11s;">💕</div>
```

</body>
</html>
