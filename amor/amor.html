<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eu também ❤️</title>

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(-45deg, #ff758c, #ff7eb3, #a18cd1, #fbc2eb);
        background-size: 400% 400%;
        animation: fundo 10s ease infinite;
        color: white;
    }

    @keyframes fundo {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .mensagem {
        padding: 50px;
    }

    .coracao {
        font-size: 120px;
        animation: pulsar 1.2s infinite;
    }

    @keyframes pulsar {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }

    h1 {
        font-size: 45px;
        margin-top: 20px;
        text-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    p {
        font-size: 22px;
        margin-top: 15px;
    }
</style>
```

</head>

<body>

```
<div class="mensagem">
    <div class="coracao">❤️</div>
    <h1>Eu também te amo!</h1>
    <p>Sabia que você ia clicar. 😌💕</p>
</div>
```

</body>
</html>
